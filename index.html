<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2e8"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>家族トレーニング</title>
<style>:root{--bg:#f6f2e8;--card:#fffdf8;--ink:#18231f;--muted:#6c756f;--green:#315f4c;--line:#ded8ca;--accent:#e9dfc5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}main{max-width:620px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}h1{font-size:27px;margin:4px 0}.sub,.small{color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}button,input{font:inherit}button{border:0;border-radius:13px;padding:11px 14px;background:var(--accent);font-weight:700}button.primary,.active{background:var(--green)!important;color:white!important}.ghost{background:transparent;border:1px solid var(--line)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.memberbar{display:flex;gap:7px;overflow:auto}.memberbar button{white-space:nowrap}.activity,.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.act,.stat{border:1px solid var(--line);border-radius:17px;padding:14px;background:#fff}.act h3{margin:0}.time{font-size:31px;font-weight:800;margin:7px 0;font-variant-numeric:tabular-nums}.stat b{display:block;font-size:19px;margin-top:4px}.hidden{display:none!important}.history{padding:0;margin:0;list-style:none}.history li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.login{min-height:78vh;display:grid;place-items:center}.loginbox{width:100%;max-width:420px}.loginbox input,.nameInput input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:white}.error{color:#a22;font-size:13px}.loading{opacity:.55;pointer-events:none}@media(max-width:390px){.activity{grid-template-columns:1fr}}</style></head><body><main>
<section id="login" class="login"><div class="loginbox card"><h1>家族トレーニング</h1><p class="sub">家族だけの記録帳 🏠</p><input id="email" type="email" placeholder="メールアドレス"><input id="password" type="password" placeholder="パスワード"><button id="loginBtn" class="primary" style="width:100%">ログイン</button><p id="loginError" class="error"></p></div></section>
<section id="app" class="hidden"><div class="row between"><div><h1>家族トレーニング</h1><div id="dateLabel" class="sub"></div></div><button id="logoutBtn" class="ghost">ログアウト</button></div>
<div class="tabs"><button id="personalTab" class="active">自分の記録</button><button id="familyTab">家族の積み上げ</button></div>
<div id="personalView"><div class="card"><div class="small">記録する人</div><div id="memberbar" class="memberbar"></div></div>
<div class="activity"><div class="act"><h3>プランク</h3><div id="plankTime" class="time">00:00</div><div class="row"><button id="plankStart" class="primary">スタート</button><button id="plankReset">リセット</button></div><div id="plankSaved" class="small"></div></div>
<div class="act"><h3>なわとび</h3><div id="ropeTime" class="time">00:00</div><div class="row"><button id="ropeStart" class="primary">スタート</button><button id="ropeReset">リセット</button></div><div id="ropeSaved" class="small"></div></div></div>
<div class="card"><b id="memberTitle">個人の積み上げ</b><div class="stats" style="margin-top:10px"><div class="stat"><span class="small">今月 プランク</span><b id="mp">0分</b></div><div class="stat"><span class="small">今月 なわとび</span><b id="mr">0分</b></div><div class="stat"><span class="small">累計 プランク</span><b id="tp">0分</b></div><div class="stat"><span class="small">累計 なわとび</span><b id="tr">0分</b></div></div></div></div>
<div id="familyView" class="hidden"><div class="card"><b>🏠 家族の積み上げ</b><div class="stats" style="margin-top:10px"><div class="stat"><span class="small">今月 プランク</span><b id="fmp">0分</b></div><div class="stat"><span class="small">今月 なわとび</span><b id="fmr">0分</b></div><div class="stat"><span class="small">家族累計 プランク</span><b id="ftp">0分</b></div><div class="stat"><span class="small">家族累計 なわとび</span><b id="ftr">0分</b></div></div><p class="small">家族みんなの総運動時間</p><div id="familyGrand" class="time">0分</div></div><div class="card"><b>メンバー別 累計</b><ul id="familyList" class="history"></ul></div></div>
<div class="card"><div class="row between"><b>家族設定</b><button id="toggleSettings" class="ghost">名前を設定</button></div><div id="settingsBody" class="hidden"><p class="small">家族5人の名前を入力してください。</p><div id="nameInputs"></div><button id="saveNames" class="primary">名前を保存</button><p id="settingsMsg" class="small"></p></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://okmhsvxeoxwqqejfnnpc.supabase.co","sb_publishable_AZDA0z7oeWvhj7Vw-cUO3g_IzzVUrq2"),$=x=>document.getElementById(x),today=()=>new Date().toLocaleDateString('sv-SE'),month=()=>today().slice(0,7);let members=[],records=[],selected=null,timers={plank:{s:0,id:null},rope:{s:0,id:null}};const fmt=s=>{s=+s||0;if(s<60)return s+"秒";let m=Math.floor(s/60),r=s%60;if(m<60)return m+"分"+(r?" "+r+"秒":"");let h=Math.floor(m/60);m%=60;return h+"時間"+(m?m+"分":"")},clock=s=>String(Math.floor(s/60)).padStart(2,'0')+":"+String(s%60).padStart(2,'0'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function boot(){let {data:{session}}=await db.auth.getSession();$('login').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);if(session)await load()}
$('loginBtn').onclick=async()=>{let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginError').textContent=error?"ログインできませんでした。入力を確認してください。":"";if(!error)boot()};$('logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload()};
async function load(){let [m,r]=await Promise.all([db.from('family_members').select('*').order('sort_order'),db.from('training_records').select('*')]);if(m.error||r.error){alert("読み込みに失敗しました");return}members=m.data||[];records=r.data||[];let pref=localStorage.getItem('familyTraining.memberId');selected=members.find(x=>String(x.id)===pref)?.id||members[0]?.id||null;if(!members.length)showSettings(true);render()}
function sum(a,act){return a.filter(x=>x.activity===act).reduce((n,x)=>n+x.seconds,0)}function render(){$('dateLabel').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});$('memberbar').innerHTML=members.map(m=>`<button data-id="${m.id}" class="${m.id===selected?'active':''}">${esc(m.name)}</button>`).join('');document.querySelectorAll('#memberbar button').forEach(b=>b.onclick=()=>{selected=+b.dataset.id;localStorage.setItem('familyTraining.memberId',selected);render()});let own=records.filter(r=>r.member_id===selected),mon=own.filter(r=>r.training_date.startsWith(month())),sm=members.find(m=>m.id===selected);$('memberTitle').textContent=(sm?.name||"個人")+"の積み上げ";$('mp').textContent=fmt(sum(mon,'プランク'));$('mr').textContent=fmt(sum(mon,'なわとび'));$('tp').textContent=fmt(sum(own,'プランク'));$('tr').textContent=fmt(sum(own,'なわとび'));let fm=records.filter(r=>r.training_date.startsWith(month()));$('fmp').textContent=fmt(sum(fm,'プランク'));$('fmr').textContent=fmt(sum(fm,'なわとび'));$('ftp').textContent=fmt(sum(records,'プランク'));$('ftr').textContent=fmt(sum(records,'なわとび'));$('familyGrand').textContent=fmt(records.reduce((n,r)=>n+r.seconds,0));$('familyList').innerHTML=members.map(m=>`<li><span>${esc(m.name)}</span><b>${fmt(records.filter(r=>r.member_id===m.id).reduce((n,r)=>n+r.seconds,0))}</b></li>`).join('');let td=own.filter(r=>r.training_date===today());$('plankSaved').textContent="今日の記録："+fmt(td.find(r=>r.activity==='プランク')?.seconds||0);$('ropeSaved').textContent="今日の記録："+fmt(td.find(r=>r.activity==='なわとび')?.seconds||0)}
function timer(k,a){let t=timers[k],el=$(k==='plank'?'plankTime':'ropeTime'),btn=$(k==='plank'?'plankStart':'ropeStart');if(t.id){clearInterval(t.id);t.id=null;btn.textContent="スタート";save(a,t.s);return}t.id=setInterval(()=>{t.s++;el.textContent=clock(t.s)},1000);btn.textContent="停止して保存"}function reset(k){let t=timers[k];if(t.id)clearInterval(t.id);t.id=null;t.s=0;$(k==='plank'?'plankTime':'ropeTime').textContent="00:00";$(k==='plank'?'plankStart':'ropeStart').textContent="スタート"}
$('plankStart').onclick=()=>timer('plank','プランク');$('ropeStart').onclick=()=>timer('rope','なわとび');$('plankReset').onclick=()=>reset('plank');$('ropeReset').onclick=()=>reset('rope');
async function save(a,s){if(!selected||!s)return;let e=records.find(r=>r.member_id===selected&&r.activity===a&&r.training_date===today()),q=e?await db.from('training_records').update({seconds:e.seconds+s,updated_at:new Date().toISOString()}).eq('id',e.id).select().single():await db.from('training_records').insert({member_id:selected,activity:a,training_date:today(),seconds:s}).select().single();if(q.error){alert("保存できませんでした");return}if(e)Object.assign(e,q.data);else records.push(q.data);reset(a==='プランク'?'plank':'rope');render()}
$('personalTab').onclick=()=>tab(true);$('familyTab').onclick=()=>tab(false);function tab(p){$('personalView').classList.toggle('hidden',!p);$('familyView').classList.toggle('hidden',p);$('personalTab').classList.toggle('active',p);$('familyTab').classList.toggle('active',!p)}
$('toggleSettings').onclick=()=>showSettings($('settingsBody').classList.contains('hidden'));function showSettings(v){$('settingsBody').classList.toggle('hidden',!v);if(v){let d=['遊','妻','長男','次男','娘'];$('nameInputs').innerHTML=Array.from({length:5},(_,i)=>`<div class="nameInput"><input maxlength="20" value="${esc(members[i]?.name||d[i])}"></div>`).join('')}}
$('saveNames').onclick=async()=>{let n=[...document.querySelectorAll('#nameInputs input')].map(x=>x.value.trim());if(n.some(x=>!x)){return $('settingsMsg').textContent="5人分入力してください"};if(!members.length){let q=await db.from('family_members').insert(n.map((name,i)=>({name,sort_order:i+1}))).select().order('sort_order');if(q.error)return $('settingsMsg').textContent="保存できませんでした";members=q.data}else{for(let i=0;i<5;i++){let q=await db.from('family_members').update({name:n[i]}).eq('id',members[i].id);if(q.error)return $('settingsMsg').textContent="保存できませんでした";members[i].name=n[i]}}selected=selected||members[0].id;$('settingsMsg').textContent="保存しました ✓";render()};boot();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
