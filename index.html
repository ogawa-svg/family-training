const db=supabase.createClient("https://okmhsvxeoxwqqejfnnpc.supabase.co","sb_publishable_AZDA0z7oeWvhj7Vw-cUO3g_IzzVUrq2");
const A=["プランク","なわとび","筋トレ","ランニング","ウォーキング","べんきょう"],I={"プランク":"🧱","なわとび":"🪢","筋トレ":"💪","ランニング":"🏃","ウォーキング":"🚶","べんきょう":"📚"};
let ms=[],rs=[],act=A[0],sec=0,iv=null,startAt=0;const $=x=>document.getElementById(x),date=()=>new Date().toLocaleDateString("sv-SE"),mon=()=>date().slice(0,7);

 if(!ms.length)return;let id=+$("member").value,mine=rs.filter(r=>+r.member_id===id),monthly=mine.filter(r=>r.training_date.startsWith(mon())),t=mine.find(r=>r.training_date===date()&&r.activity===act);
 $("today").textContent=`今日の${act}: ${fmt(t?.seconds||0)}`;$("personStats").innerHTML=`<p class="muted">今月</p>${stats(monthly)}<p class="muted">累計</p>${stats(mine)}`;

}

async function boot(){let {data}=await db.auth.getSession();if(!data.session)return;$("login").classList.add("hidden");$("app").classList.remove("hidden");try{await load()}catch(e){toast("読み込みに失敗しました")}}
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");boot();
</script></body></html>
