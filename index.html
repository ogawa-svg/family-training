<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>家族トレーニング</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#202124;background:#f7f7f5}
*{box-sizing:border-box} body{margin:0;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);max-width:760px;margin:auto}
h1{font-size:23px;margin:18px 0 3px}.sub{color:#6b6b6b;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:white;border:1px solid #e3e3df;border-radius:18px;padding:15px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#eeeDEA;border-radius:14px;padding:11px}.stat small{display:block;color:#666;margin-bottom:4px}.stat b{font-size:17px}
.exercise h2{font-size:17px;margin:0}.who{font-size:12px;color:#777}.time{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;margin:18px 0}
button{font:inherit;min-height:48px;border-radius:13px;border:1px solid #d7d7d2;background:white;padding:8px 12px}
.primary{background:#222;color:white;border-color:#222;flex:1}.row{display:flex;gap:8px}.save{width:100%;margin-top:8px}.save:disabled{opacity:.4}
.titleRow{display:flex;align-items:center;justify-content:space-between;gap:10px}.badge{font-size:12px;color:#666}
.progress{height:8px;background:#ddd;border-radius:9px;overflow:hidden}.bar{height:100%;background:#222;width:0}
.history{width:100%;border-collapse:collapse;font-size:13px}.history th,.history td{padding:9px 4px;border-bottom:1px solid #eee;text-align:left}.history td:nth-child(n+2),.history th:nth-child(n+2){text-align:right}
.edit{min-height:34px;padding:3px 8px;font-size:12px}.note{font-size:12px;color:#777;line-height:1.5}.goal{margin-top:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<h1>家族トレーニング</h1>
<div class="sub" id="today"></div>

<section class="card">
 <div class="titleRow"><b>📅 今月</b><span class="badge" id="month"></span></div>
 <div class="stats" style="margin-top:10px">
  <div class="stat"><small>🧱 プランク</small><b id="mp">0秒</b></div>
  <div class="stat"><small>🪢 縄跳び</small><b id="mr">0秒</b></div>
  <div class="stat"><small>合計</small><b id="ma">0秒</b></div>
 </div>
</section>

<section class="card">
 <div class="titleRow"><b>🏆 これまでの累計</b><span class="badge" id="days">0日</span></div>
 <div class="stats" style="margin-top:10px">
  <div class="stat"><small>プランク</small><b id="tp">0秒</b></div>
  <div class="stat"><small>縄跳び</small><b id="tr">0秒</b></div>
  <div class="stat"><small>合計</small><b id="ta">0秒</b></div>
 </div>
 <div class="goal"><div class="titleRow"><span class="badge" id="goalText"></span><span class="badge" id="goalValue"></span></div><div class="progress"><div class="bar" id="goalBar"></div></div></div>
</section>

<div class="grid">
 <section class="card exercise">
  <div class="titleRow"><div><h2>🧱 プランク</h2><div class="who">息子さんと</div></div><span class="badge" id="plankStatus">未記録</span></div>
  <div class="time" id="plankTime">00:00</div>
  <div class="row"><button class="primary" id="plankStart">START</button><button id="plankReset">リセット</button></div>
  <button class="save" id="plankSave" disabled>今日の記録に保存</button>
 </section>
 <section class="card exercise">
  <div class="titleRow"><div><h2>🪢 縄跳び</h2><div class="who">奥さんと</div></div><span class="badge" id="ropeStatus">未記録</span></div>
  <div class="time" id="ropeTime">00:00</div>
  <div class="row"><button class="primary" id="ropeStart">START</button><button id="ropeReset">リセット</button></div>
  <button class="save" id="ropeSave" disabled>今日の記録に保存</button>
 </section>
</div>

<section class="card">
 <div class="titleRow"><b>🔥 継続</b><span id="streak">連続 0日</span></div>
</section>

<section class="card">
 <div class="titleRow"><b>最近の記録</b><span class="badge">編集できます</span></div>
 <table class="history"><thead><tr><th>日付</th><th>プランク</th><th>縄跳び</th><th></th></tr></thead><tbody id="history"></tbody></table>
 <p class="note">時間はこの端末のブラウザ内に保存されます。ブラウザのサイトデータを削除すると記録も消えるため、長期利用版ではバックアップ機能の追加がおすすめです。</p>
</section>

<script>
const KEY='familyTraining.v1';
let records=JSON.parse(localStorage.getItem(KEY)||'{}');
const timers={plank:{s:0,r:false,id:null},rope:{s:0,r:false,id:null}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const clock=s=>pad(Math.floor(s/60))+':'+pad(s%60);
const pretty=s=>s<60?s+'秒':s<3600?Math.floor(s/60)+'分'+(s%60?' '+s%60+'秒':''):Math.floor(s/3600)+'時間 '+Math.floor((s%3600)/60)+'分';
const keyDate=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=keyDate();
$('today').textContent=new Intl.DateTimeFormat('ja-JP',{dateStyle:'full'}).format(new Date());
$('month').textContent=(new Date().getMonth()+1)+'月';

function saveDB(){localStorage.setItem(KEY,JSON.stringify(records))}
function todayRec(){return records[todayKey]||{plank:0,rope:0}}
function drawTimer(k){
 const t=timers[k]; $(k+'Time').textContent=clock(t.s); $(k+'Start').textContent=t.r?'STOP':'START';
 $(k+'Save').disabled=!t.s||t.r; $(k+'Status').textContent=todayRec()[k]?'✓ 記録済み':'未記録';
}
function toggle(k){let t=timers[k];if(t.r){clearInterval(t.id);t.r=false;t.id=null}else{t.r=true;t.id=setInterval(()=>{t.s++;drawTimer(k)},1000)}drawTimer(k)}
function reset(k){let t=timers[k];if(t.id)clearInterval(t.id);t.r=false;t.id=null;t.s=0;drawTimer(k)}
function commit(k){let t=timers[k];if(!t.s||t.r)return;records[todayKey]={...todayRec(),[k]:t.s};saveDB();render()}
['plank','rope'].forEach(k=>{$(k+'Start').onclick=()=>toggle(k);$(k+'Reset').onclick=()=>reset(k);$(k+'Save').onclick=()=>commit(k);drawTimer(k)});

function totals(filter){
 return Object.entries(records).filter(([d])=>!filter||filter(d)).reduce((a,[,r])=>({plank:a.plank+(+r.plank||0),rope:a.rope+(+r.rope||0)}),{plank:0,rope:0});
}
function calcStreak(){
 let n=0,d=new Date();for(let i=0;i<5000;i++){let r=records[keyDate(d)];if(r&&(r.plank||r.rope)){n++;d.setDate(d.getDate()-1)}else break}return n;
}
function renderHistory(){
 const body=$('history');body.innerHTML='';
 Object.keys(records).sort().reverse().slice(0,14).forEach(d=>{
  let r=records[d],tr=document.createElement('tr');
  tr.innerHTML=`<td>${d.slice(5).replace('-','/')}</td><td>${r.plank?clock(r.plank):'−'}</td><td>${r.rope?clock(r.rope):'−'}</td><td><button class="edit">編集</button></td>`;
  tr.querySelector('button').onclick=()=>{
   const p=prompt('プランク（秒）',r.plank||0); if(p===null)return;
   const q=prompt('縄跳び（秒）',r.rope||0); if(q===null)return;
   const pv=Math.max(0,Math.min(86400,parseInt(p)||0)),qv=Math.max(0,Math.min(86400,parseInt(q)||0));
   if(!pv&&!qv) delete records[d]; else records[d]={plank:pv,rope:qv}; saveDB();render();
  };body.appendChild(tr);
 });
 if(!body.children.length){body.innerHTML='<tr><td colspan="4" style="text-align:center;color:#777">まだ記録がありません</td></tr>'}
}
function render(){
 const y=new Date().getFullYear(),m=pad(new Date().getMonth()+1),prefix=`${y}-${m}`;
 const mo=totals(d=>d.startsWith(prefix)),all=totals(),sum=all.plank+all.rope;
 $('mp').textContent=pretty(mo.plank);$('mr').textContent=pretty(mo.rope);$('ma').textContent=pretty(mo.plank+mo.rope);
 $('tp').textContent=pretty(all.plank);$('tr').textContent=pretty(all.rope);$('ta').textContent=pretty(sum);
 $('days').textContent=Object.values(records).filter(r=>r.plank||r.rope).length+'日';
 $('streak').textContent='連続 '+calcStreak()+'日';
 const goals=[600,1800,3600,10800,36000,72000,180000],g=goals.find(x=>sum<x)||360000;
 $('goalText').textContent='次の節目 '+pretty(g);$('goalValue').textContent=pretty(sum)+' / '+pretty(g);$('goalBar').style.width=Math.min(100,sum/g*100)+'%';
 ['plank','rope'].forEach(drawTimer);renderHistory();
}
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
